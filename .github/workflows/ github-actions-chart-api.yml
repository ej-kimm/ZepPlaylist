name: GitHub Actions Chart
on:
  schedule:
    - cron: '5 * * * *'
jobs:
  chart_api:
    runs-on: ubuntu-latest
    steps:
      - name: call Meion Chart API
        run: curl -X GET "https://zep-playlist.vercel.app/api/koreanChart"
      - name: call Billborard Chart API
        run: curl -X GET "https://zep-playlist.vercel.app/api/billboardChart"
